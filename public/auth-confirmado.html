<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmando e-mail... | Organiza Pouco</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f8fafc;
        color: #334155;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e2e8f0;
        border-top-color: #0ea5e9;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <p id="status">Confirmando seu e-mail, aguarde...</p>

    <script>
      const supabaseUrl = 'https://bqhtemwakomvfhkjmzqs.supabase.co'
      const supabaseAnonKey = 'sb_publishable_4UfOScDU3DiJ4vyPrAKakg_1xmw4Qcp'
      const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey)

      const params = new URLSearchParams(window.location.search)
      const type = params.get('type') // 'signup'
      const accessToken = params.get('access_token')
      const refreshToken = params.get('refresh_token')
      const expiresIn = params.get('expires_in')
      const error = params.get('error')
      const errorCode = params.get('error_code')
      const errorDescription = params.get('error_description')

      const REDIRAZEE_PARA_LOGIN = 5000 // 5 segundos

      function redirecionarLogin() {
        window.location.replace('/organiza-pouco2.0/')
      }

      async function confirmar() {
        const status = document.getElementById('status')

        // Link inválido ou expirado (ex: reset de senha / cadastro com token expirado)
        if (error || errorCode) {
          status.textContent =
            'Link inválido ou expirado. Redirecionando para o login...'
          setTimeout(redirecionarLogin, REDIRAZEE_PARA_LOGIN)
          return
        }

        try {
          if (accessToken && refreshToken) {
            // Define a sessão com os tokens recebidos do redirect
            const { error: sessError } = await supabase.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken,
            })
            if (sessError) throw sessError
          } else if (type === 'signup') {
            // Fallback: verifica OTP do signup
            const token = params.get('token') || accessToken
            const { error: otpError } = await supabase.auth.verifyOtp({
              token,
              type: 'signup',
            })
            if (otpError) throw otpError
          }

          status.textContent = 'E-mail confirmado com sucesso! Redirecionando...'
          setTimeout(redirecionarLogin, REDIRAZEE_PARA_LOGIN)
        } catch (err) {
          console.error(err)
          status.textContent =
            'Não foi possível confirmar o e-mail. Redirecionando para o login...'
          setTimeout(redirecionarLogin, REDIRAZEE_PARA_LOGIN)
        }
      }

      confirmar()
    </script>
  </body>
</html>
