<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-100 dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiza Pouco</title>
    <link rel="stylesheet" href="/src/styles.css">
    <link rel="manifest" href="/organiza-pouco2.0/manifest.json">
    <script>
      // Guarda de versão: se este index.html veio do cache e já existe build
      // mais nova, carrega o snapshot index-<versao>.html (GitHub Pages).
      (function () {
        var versaoAtual = '__BUILD_VERSION__'
        var base = '__BUILD_BASE__'
        if (versaoAtual.indexOf('__') === 0) return // modo dev

        var url = new URL(window.location.href)
        // Já estamos na build publicada: nada a fazer. Não reescrevemos a URL,
        // pois voltar para o index.html em cache reiniciaria o redirecionamento.
        if (url.searchParams.get('v') === versaoAtual) return

        fetch(base + 'version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null })
          .then(function (dados) {
            if (!dados || !dados.version || dados.version === versaoAtual) return
            try {
              localStorage.setItem('organiza_pouco_ultima_versao', versaoAtual)
            } catch (e) {}
            window.location.replace(base + 'index-' + dados.version + '.html?v=' + dados.version)
          })
          .catch(function () {})
      })()
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-emerald-50/40 px-3 py-4 sm:px-6 sm:py-6 transition-colors duration-300 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 text-slate-800 dark:text-slate-100">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/organiza-pouco2.0/sw.js')
      }
    </script>
</body>
</html>
